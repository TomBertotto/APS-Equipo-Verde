services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fia
      POSTGRES_PASSWORD: fia
      POSTGRES_DB: fia
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # Por TCP: el servidor temporal que crea la base en un volumen nuevo solo escucha por socket
      test: ["CMD-SHELL", "pg_isready -U fia -h 127.0.0.1"]
      interval: 2s
      retries: 20
      # La inicialización de un volumen nuevo puede tardar ~1 min; los fallos en ese lapso no cuentan
      start_period: 120s

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://fia:fia@db:5432/fia
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/usr/src/backend
      - /usr/src/backend/node_modules
    depends_on:
      db:
        condition: service_healthy

  app:
    build: ./app
    environment:
      # The browser calls the API from the host, so this is localhost, not "backend"
      EXPO_PUBLIC_API_URL: http://localhost:3000
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "8081:8081"
    volumes:
      - ./app:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - backend

volumes:
  db-data:
